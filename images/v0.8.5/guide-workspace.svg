  <circle cx="912" cy="421" r="5" fill="#9baabd"/><text x="926" y="425" fill="#66758a" font-family="Segoe UI,Arial,sans-serif" font-size="12">找到隐藏的补给</text>
  <circle cx="912" cy="448" r="5" fill="#9baabd"/><text x="926" y="452" fill="#66758a" font-family="Segoe UI,Arial,sans-serif" font-size="12">完成可选挑战</text>
